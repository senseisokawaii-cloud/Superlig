<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lig Simülasyonu</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Segoe UI",system-ui,Arial,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block}

  #tp{position:fixed;right:8px;top:52px;z-index:6;background:#000c;color:#fff;padding:8px;border-radius:12px;display:flex;flex-wrap:wrap;gap:5px;max-width:310px;font-size:13px}
  #tp[hidden],#tpBtn[hidden]{display:none}

  #tp button{border:0;border-radius:8px;padding:6px 8px;background:#2f7fe0;color:#fff;font-size:13px}

</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="debug"></div>
<button id="tpBtn" hidden>⚙</button>
<div id="tp" hidden>
  <b>Test paneli (yayında görünmez)</b>
  <button data-a="chatH">Ev sahibi yorum</button>
  <button data-a="chatA">Deplasman yorum</button>
  <button data-a="chatN">Nötr yorum</button>
  <button class="g" data-a="gH1">Ev gül</button>
  <button class="g" data-a="gA1">Dep tiktok</button>
  <button class="g" data-a="gH10">Ev oyuncu</button>
  <button class="g" data-a="gA10">Dep oyuncu</button>
  <button class="g" data-a="gH20">Ev penaltı</button>
  <button class="g" data-a="gA20">Dep penaltı</button>
  <button class="g" data-a="gN5">Diğer 5</button>
  <button class="o" data-a="like">100 beğeni</button>
  <button class="o" data-a="next">Sonraki aşama</button>
  <button class="o" data-a="skip">Maçı bitir</button>
  <button class="o" data-a="faul">Faul</button>
  <button class="o" data-a="kavga">Kavga</button>
  <button class="o" data-a="hata">Hatalı karar</button>
  <button class="o" data-a="arapas">Araya pas</button>
  <button class="o" data-a="hakem">Hakem yap</button>
  <button class="o" data-a="reset">Sezonu sıfırla</button>
  <button class="o" data-a="demo">Demo aç/kapa</button>
</div>
<script>
'use strict';
/* =====================================================================
   LİG SİMÜLASYONU — TikTok LIVE interaktif sahne
   GS, FB, BJK, TS ve AMD'nin maçları canlı oynanır, diğer maçlar haftanın sonunda hesaplanır.
   Oyuncu ismi yok: sadece forma renkleri ve numaralar. Armalar özgün kalkan çizimleridir.
   ===================================================================== */
const VERSION = 'lig-v2.0';
const DEFAULT_DEMO = false;
const Q = new URLSearchParams(location.search);
const CFG = {
  ws: Q.get('ws') || 'ws://localhost:21213/',
  demo: Q.get('demo') === '1' || (DEFAULT_DEMO && Q.get('demo') !== '0'),
  speed: Math.max(0.25, Math.min(10, +Q.get('speed') || 1)),
  preMs: 9e3,         // "Maç başlıyor, herkes tribünlere" + takımlar sahaya çıkar
  halfMs: 60e3,       // bir devre gerçek süresi (45 dk)
  htMs: 6e3, ftMs: 4e3, tableMs: 7e3, othersMs: 5e3, champMs: 12e3, goalPauseMs: 4200,
  vol: Math.max(0, Math.min(1, Q.has('vol') ? +Q.get('vol') : .55)),   // ses seviyesi (?ses=0 ile kapalı)
  gift: { atak: 5, pozisyon: 10, penalti: 30, hakem: null },   // jeton eşikleri; hakem: sen belirleyince sayı yaz (ör. 20)
  refMatches: 1,      // izleyici hakem kaç maç yönetsin
  // Hangi TikTok ödülü ne yapar? (TikFinity'deki ödül adıyla eşleşir, büyük/küçük harf fark etmez; Türkçe adı farklıysa listeye ekle)
  giftMap: {
    tribunEv:  ['rose', 'gül'],                                        // 1 jeton · ev sahibi tribününü ateşler
    tribunDep: ['tiktok'],                                             // 1 jeton · deplasman tribününü ateşler
    oyuncuEv:  ['friendship necklace', 'dostluk kolyesi', 'arkadaşlık kolyesi'],          // 10 jeton · ev sahibi takımında oyuncu olur
    oyuncuDep: ['rosa'],                                               // 10 jeton · deplasman takımında oyuncu olur
    penaltiEv: ['perfume', 'parfüm'],                                  // 20 jeton · ev sahibine penaltı
    penaltiDep:['bouquet', 'buket', 'çiçek buketi'],                   // 20 jeton · deplasmana penaltı
    penalti:   [],                                                     // (boş) tek ödül olsun istersen: atanın tuttuğu takıma penaltı
  },
  squadSize: 10,      // her takımda ödülle oyuncu olan en fazla kişi (kaleci hariç); 11. gelen en eskinin yerine geçer
  bigOnly: ['GS', 'FB', 'BJK', 'TS', 'AMD'],   // sadece bu takımların maçları canlı oynanır
};

/* ---------------- takımlar (2026-27 Süper Lig, 18 takım) ----------------
   pattern: half (yarım yarım), stripes (dikey çubuk), hoop (yatay bant), sleeves (kollar farklı), solid
   str: oyun içi güç (kurgusal denge değeri) */
const TEAMS = [
  { id: 'GS', key: ['gs', 'galatasaray', 'cimbom', 'aslan', 'cimbombom'], c1: '#fdb912', c2: '#a90432', sh: '#a90432', pat: 'half', str: 86 },
  { id: 'FB', key: ['fb', 'fener', 'fenerbahçe', 'fenerbahce', 'kanarya'], c1: '#16245a', c2: '#ffe600', sh: '#ffffff', pat: 'stripes', str: 85 },
  { id: 'BJK', key: ['bjk', 'beşiktaş', 'besiktas', 'kartal', 'kara kartal'], c1: '#111111', c2: '#ffffff', sh: '#111111', pat: 'stripes', str: 81 },
  { id: 'TS', key: ['ts', 'trabzon', 'trabzonspor', 'fırtına', 'firtina', 'bordo mavi'], c1: '#7b1630', c2: '#57a6dc', sh: '#ffffff', pat: 'sleeves', str: 79 },
  { id: 'İBFK', key: ['başakşehir', 'basaksehir', 'ibfk'], c1: '#f26b21', c2: '#1d2c5e', sh: '#1d2c5e', pat: 'solid', str: 74 },
  { id: 'GÖZ', key: ['göztepe', 'goztepe', 'göz-göz', 'goz'], c1: '#ffd200', c2: '#c8102e', sh: '#c8102e', pat: 'sleeves', str: 73 },
  { id: 'SAM', key: ['samsun', 'samsunspor'], c1: '#e2001a', c2: '#ffffff', sh: '#ffffff', pat: 'solid', str: 72 },
  { id: 'KSP', key: ['kasımpaşa', 'kasimpasa'], c1: '#16285e', c2: '#ffffff', sh: '#16285e', pat: 'solid', str: 70 },
  { id: 'RİZ', key: ['rize', 'rizespor', 'çaykur'], c1: '#0a8f3e', c2: '#1e5aa8', sh: '#1e5aa8', pat: 'stripes', str: 70 },
  { id: 'KON', key: ['konya', 'konyaspor'], c1: '#1a8c3a', c2: '#ffffff', sh: '#ffffff', pat: 'hoop', str: 69 },
  { id: 'ALN', key: ['alanya', 'alanyaspor'], c1: '#f47a20', c2: '#0b7a3b', sh: '#0b7a3b', pat: 'solid', str: 69 },
  { id: 'GFK', key: ['antep', 'gaziantep', 'gfk'], c1: '#c8102e', c2: '#111111', sh: '#111111', pat: 'half', str: 69 },
  { id: 'EYP', key: ['eyüp', 'eyup', 'eyüpspor', 'eyupspor'], c1: '#5a2a82', c2: '#f5c400', sh: '#5a2a82', pat: 'solid', str: 68 },
  { id: 'KOC', key: ['kocaeli', 'kocaelispor'], c1: '#0d7d3b', c2: '#111111', sh: '#111111', pat: 'stripes', str: 67 },
  { id: 'GB', key: ['gençler', 'gencler', 'gençlerbirliği', 'genclerbirligi'], c1: '#d0101b', c2: '#111111', sh: '#111111', pat: 'hoop', str: 66 },
  { id: 'AMD', key: ['amed', 'amedspor'], c1: '#0f8a3c', c2: '#d71920', sh: '#0f8a3c', pat: 'stripes', str: 66 },
  { id: 'ERZ', key: ['erzurum', 'erzurumspor'], c1: '#1f5fbf', c2: '#ffffff', sh: '#1f5fbf', pat: 'solid', str: 65 },
  { id: 'ÇOR', key: ['çorum', 'corum'], c1: '#d81e2a', c2: '#111111', sh: '#111111', pat: 'stripes', str: 65 },
];
const TM = Object.fromEntries(TEAMS.map(t => [t.id, t]));
const KEYMAP = []; for (const t of TEAMS) { for (const k of t.key) KEYMAP.push([k, t.id]); KEYMAP.push([t.id.toLocaleLowerCase('tr'), t.id]); }   // kısaltmalar da (amd, koc, göz…)
KEYMAP.sort((a, b) => b[0].length - a[0].length);

/* ---------------- yardımcılar ---------------- */
const W = 1080, H = 1920;
const F = '"Segoe UI","Segoe UI Emoji",system-ui,Arial,sans-serif';
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const shortName = s => { s = String(s || '').trim(); const a = [...s]; return a.length > 12 ? a.slice(0, 11).join('') + '…' : s; };
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
function fit() { const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; }
addEventListener('resize', fit); fit();
function rr(g, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function ell(g, x, y, rx, ry) { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
function txt(s, x, y, size, color, align = 'center', weight = 800, strokeA = .78) {
  ctx.font = `${weight} ${size}px ${F}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (strokeA > 0) { ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size / 5.5); ctx.strokeStyle = `rgba(0,0,0,${strokeA})`; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function fitSize(s, size, maxW, weight = 900) { ctx.font = `${weight} ${size}px ${F}`; const w = ctx.measureText(s).width; return w > maxW ? Math.floor(size * maxW / w) : size; }
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
const cdist = (a, b) => { const x = hex2rgb(a), y = hex2rgb(b); return Math.hypot(x[0] - y[0], x[1] - y[1], x[2] - y[2]); };
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const lum = h => { const [r, g, b] = hex2rgb(h); return .299 * r + .587 * g + .114 * b; };
const brightCol = t => lum(t.c1) > 110 ? t.c1 : lum(t.c2) > 110 ? t.c2 : '#ffffff';   // koyu renkli takımda okunur yazı rengi
const ordinal = n => n === 1 ? 'LİDER' : `${n}.`;

/* ---------------- forma ve arma çizimi ---------------- */
function kitFor(team, other) {   // renk çakışırsa deplasman beyaz/alternatif forma giyer
  const t = TM[team], o = TM[other];
  if (o && (cdist(t.c1, o.c1) < 120 || (t.pat === 'stripes' && o.pat === 'stripes' && cdist(t.c2, o.c2) < 120)))
    return { c1: '#f4f4f4', c2: t.c1, sh: '#f4f4f4', pat: 'sleeves', alt: true };
  return { c1: t.c1, c2: t.c2, sh: t.sh, pat: t.pat };
}
function patternFill(g, x, y, w, h, kit) {
  g.fillStyle = kit.c1; g.fillRect(x, y, w, h);
  g.fillStyle = kit.c2;
  if (kit.pat === 'half') g.fillRect(x + w / 2, y, w / 2, h);
  else if (kit.pat === 'stripes') { const n = 5, sw = w / n; for (let i = 1; i < n; i += 2) g.fillRect(x + i * sw, y, sw, h); }
  else if (kit.pat === 'hoop') g.fillRect(x, y + h * .38, w, h * .26);
  else if (kit.pat === 'solid') g.fillRect(x, y, w, h * .14);
}
function drawShirt(g, x, y, w, h, kit) {   // ön görünüş forma (tablo ve kalabalık için)
  g.save();
  g.beginPath(); g.moveTo(x + w * .3, y); g.lineTo(x + w * .7, y); g.lineTo(x + w, y + h * .22); g.lineTo(x + w * .86, y + h * .42);
  g.lineTo(x + w * .78, y + h * .36); g.lineTo(x + w * .78, y + h); g.lineTo(x + w * .22, y + h); g.lineTo(x + w * .22, y + h * .36);
  g.lineTo(x + w * .14, y + h * .42); g.lineTo(x, y + h * .22); g.closePath();
  g.clip(); patternFill(g, x, y, w, h, kit);
  if (kit.pat === 'sleeves') { g.fillStyle = kit.c2; g.fillRect(x, y, w * .22, h); g.fillRect(x + w * .78, y, w * .22, h); }
  g.restore();
  g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(x + w * .3, y); g.lineTo(x + w * .7, y); g.lineTo(x + w, y + h * .22); g.lineTo(x + w * .86, y + h * .42); g.lineTo(x + w * .78, y + h * .36); g.lineTo(x + w * .78, y + h); g.lineTo(x + w * .22, y + h); g.lineTo(x + w * .22, y + h * .36); g.lineTo(x + w * .14, y + h * .42); g.lineTo(x, y + h * .22); g.closePath(); g.stroke();
}
function drawCrest(g, cx, cy, s, id) {   // özgün kalkan arma: takım renkleri + kısaltma
  const t = TM[id], w = s, h = s * 1.18, x = cx - w / 2, y = cy - h / 2;
  const path = () => { g.beginPath(); g.moveTo(x, y + h * .08); g.quadraticCurveTo(cx, y - h * .06, x + w, y + h * .08); g.lineTo(x + w, y + h * .52); g.quadraticCurveTo(x + w, y + h * .86, cx, y + h); g.quadraticCurveTo(x, y + h * .86, x, y + h * .52); g.closePath(); };
  g.save(); path(); g.fillStyle = '#fff'; g.fill(); g.clip();
  const k = { c1: t.c1, c2: t.c2, pat: t.pat === 'sleeves' ? 'half' : t.pat };
  patternFill(g, x + w * .08, y + h * .06, w * .84, h * .9, k);
  g.restore();
  g.save(); path(); g.lineWidth = s * .07; g.strokeStyle = '#fff'; g.stroke(); g.lineWidth = s * .025; g.strokeStyle = 'rgba(0,0,0,.4)'; g.stroke(); g.restore();
  const fs = id.length > 3 ? s * .26 : id.length > 2 ? s * .32 : s * .4;
  g.font = `900 ${fs}px ${F}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineJoin = 'round'; g.lineWidth = fs * .22; g.strokeStyle = 'rgba(0,0,0,.75)'; g.strokeText(id, cx, cy + h * .04);
  g.fillStyle = '#fff'; g.fillText(id, cx, cy + h * .04);
}

/* ---------------- sezon / fikstür / tablo ---------------- */
const SAVE_KEY = 'lig-sim-v1';
let S = null;   // kalıcı sezon durumu
function makeFixtures(seed) {
  const r = mulberry(seed), ids = TEAMS.map(t => t.id).sort(() => r() - .5), n = ids.length, arr = ids.slice(), rounds = [];
  for (let k = 0; k < n - 1; k++) {
    const m = [];
    for (let i = 0; i < n / 2; i++) { let h = arr[i], a = arr[n - 1 - i]; if ((i === 0 && k % 2) || (i > 0 && (k + i) % 2)) [h, a] = [a, h]; m.push([h, a]); }
    rounds.push(m); arr.splice(1, 0, arr.pop());
  }
  return rounds.concat(rounds.map(m => m.map(([h, a]) => [a, h])));
}
function newSeason(no) {
  const table = {}; for (const t of TEAMS) table[t.id] = { O: 0, G: 0, B: 0, M: 0, AG: 0, YG: 0, P: 0 };
  S = { season: no, seed: Math.floor(Math.random() * 1e9), round: 0, liveIdx: 0, table, results: {}, squads: (S && S.squads) || {} };   // ödülle oyuncu olanlar yeni sezonda da kalır
  S.fix = makeFixtures(S.seed);
  save();
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify({ ...S, fix: undefined })); } catch (e) { } }
function load() {
  try { const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (d && d.table && d.seed) { S = d; S.fix = makeFixtures(S.seed); return true; } } catch (e) { }
  return false;
}
const isBig = id => CFG.bigOnly.includes(id);
const liveMatches = r => S.fix[r].map((m, i) => ({ h: m[0], a: m[1], i })).filter(m => isBig(m.h) || isBig(m.a));
function record(h, a, gh, ga, r, i) {
  const th = S.table[h], ta = S.table[a];
  th.O++; ta.O++; th.AG += gh; th.YG += ga; ta.AG += ga; ta.YG += gh;
  if (gh > ga) { th.G++; ta.M++; th.P += 3; } else if (gh < ga) { ta.G++; th.M++; ta.P += 3; } else { th.B++; ta.B++; th.P++; ta.P++; }
  S.results[r + '-' + i] = [gh, ga]; save();
}
function standings() {
  return TEAMS.map(t => ({ id: t.id, ...S.table[t.id] })).sort((x, y) => y.P - x.P || (y.AG - y.YG) - (x.AG - x.YG) || y.AG - x.AG || x.id.localeCompare(y.id, 'tr'));
}
const rankOf = id => standings().findIndex(r => r.id === id) + 1;
function poisson(l) { let L = Math.exp(-l), k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L); return k - 1; }
function quickSim(h, a) {
  const d = (TM[h].str - TM[a].str) / 10;
  return [poisson(clamp(1.45 + d * .35, .4, 3.2)), poisson(clamp(1.1 - d * .3, .3, 2.8))];
}

/* ---------------- izleyiciler / tribün ---------------- */
const viewers = new Map();   // uid -> {name, team, side, mid, seen, flash, hop, bubble, slot}
let matchId = 0, viewerSeq = 0;
function viewer(uid, name) {
  let v = viewers.get(uid);
  if (!v) { v = { uid, name: shortName(name), team: null, seen: now, flash: 0, hop: 0, bubble: null, total: 0, order: ++viewerSeq, likeT: 0, flareUntil: 0, banner: false, score: 0, mscore: 0, mid: -1 }; viewers.set(uid, v); }
  v.seen = now; if (name) v.name = shortName(name);
  return v;
}
function detectTeam(text) {
  const t = ' ' + text.toLocaleLowerCase('tr').replace(/[^\p{L}\p{N}\s-]/gu, ' ') + ' ';
  for (const [k, id] of KEYMAP) if (t.includes(' ' + k + ' ') || (k.length > 4 && t.includes(k))) return id;
  return null;
}
// ev sahibi taraftarı: ev sahibi kale arkası; deplasman: karşı kale arkası;
// başka takımların taraftarları yan tribünlerde kendi takımlarıyla yan yana; takım yazmamış olanlar yan tribünün tarafsız bölümünde
const active = v => now - v.seen < 15 * 60e3;
const fansOf = side => { if (!M) return []; const id = side === 0 ? M.h : M.a; const a = []; for (const v of viewers.values()) if (v.team === id && active(v)) a.push(v); return a; };
function sideFor(v) {   // destek hangi takıma gidiyor (tarafsız: geride olan takıma)
  if (!M) return null;
  if (v.team === M.h) return 0; if (v.team === M.a) return 1;
  return M.score[0] < M.score[1] ? 0 : M.score[1] < M.score[0] ? 1 : (M.mom[0] <= M.mom[1] ? 0 : 1);
}
let seatMap = new Map(), seatT = 0;   // uid -> {x, y, kind}
function assignSeats() {
  seatMap = new Map(); if (!M) return;
  const list = [...viewers.values()].filter(active).sort((a, b) => a.order - b.order);
  const home = list.filter(v => v.team === M.h), away = list.filter(v => v.team === M.a);
  const others = list.filter(v => v.team !== M.h && v.team !== M.a).sort((a, b) => (a.team ? TEAMS.findIndex(t => t.id === a.team) : 99) - (b.team ? TEAMS.findIndex(t => t.id === b.team) : 99) || a.order - b.order);
  home.slice(0, 272).forEach((v, i) => seatMap.set(v.uid, { ...endSeat(0, i), kind: 0 }));
  away.slice(0, 272).forEach((v, i) => seatMap.set(v.uid, { ...endSeat(1, i), kind: 1 }));
  others.slice(0, 216).forEach((v, i) => seatMap.set(v.uid, { ...sideSeat(i), kind: 2 }));
}
function endSeat(side, i) {
  const row = Math.floor(i / 34), ci = i % 34, col = ci % 2 ? -(ci + 1) / 2 : ci / 2;
  return { x: 540 + col * 30 + (row % 2 ? 15 : 0), y: side === 0 ? STAND.top.y1 - 16 - row * 23 : STAND.bot.y0 + 22 + row * 23 };
}
function sideSeat(i) {
  const col = i % 2, k = Math.floor(i / 2), left = k < 54, r = left ? k : k - 54;
  return { x: left ? 20 + col * 30 : W - 50 + col * 30, y: 342 + r * 23.5 };
}

      ctx.strokeStyle = `rgba(190,235,160,${.22 * a})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(k.x - cx - cy * .5, k.y - cy + cx * .5); ctx.lineTo(k.x + cx - cy * .5, k.y + cy + cx * .5); ctx.stroke();
    }
  }
  if (M && M.ball.anim && M.ball.anim.pass) {   // pas çizgisi
    const a = M.ball.anim; ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3; ctx.setLineDash([10, 10]); ctx.lineDashOffset = -now / 20;
    ctx.beginPath(); ctx.moveTo(a.x0, a.y0); ctx.lineTo(a.x1, a.y1); ctx.stroke(); ctx.setLineDash([]);
  }
  if (M) {
    // tribünler: gol atınca o tribün zıplar
    ctx.drawImage(crowdL, 0, 0);
    if (now - M.waveT0 < 2600) {   // tribün dalgası
      const wx = (now - M.waveT0) / 2600 * (W + 240) - 120;
      ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.fillRect(wx - 50, STAND.top.y0, 100, STAND.top.y1 - STAND.top.y0); ctx.fillRect(W - wx - 50, STAND.bot.y0, 100, STAND.bot.y1 - STAND.bot.y0);
    }
    drawViewers(); drawBoards(); drawBanners();
    for (const l of M.litter) { ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.rot); ctx.globalAlpha = clamp((l.until - now) / 800, 0, 1); ctx.font = `26px ${F}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(l.e, 0, 0); ctx.restore(); }
    drawBenches();
    const R0 = M.ref, refP = { side: 0, num: '', x: R0.x, y: R0.y, vx: R0.vx, vy: R0.vy, run: R0.run2, ph: R0.ph, cheer: 0, kit: { c1: '#151515', c2: '#ffd60a', sh: '#151515', pat: 'sleeves' }, viewer: { uid: refViewer ? refViewer.uid : null, name: refViewer ? `🧑‍⚖️ ${refViewer.name}` : 'HAKEM' }, coachPose: now < R0.cardUntil ? 'argue' : 'normal' };   // hakem tarafsız: gol sevincine katılmaz, kartı kaldırır
    const coaches = [0, 1].map(s => { const c = M.coach[s], t = TM[teamOf(s)]; return { side: s, num: '', x: c.x, y: c.y, run: false, ph: c.ph, cheer: 0, kit: { c1: '#23262f', c2: t.c1, sh: '#23262f', pat: 'solid' }, viewer: { uid: null, name: `${t.id} T.D.` }, coachPose: now < c.moodUntil ? ({ jump: 'cheer', sad: 'sad', argue: 'argue', shout: 'shout' }[c.mood] || 'normal') : 'normal' }; });
    for (const l of M.leavers) l.coachPose = l.sad ? 'sad' : 'normal';   // oyundan çıkanlar sevince karışmaz
    const ps = [...onField(0).filter(p => !(p.hiddenUntil > now)), ...onField(1).filter(p => !(p.hiddenUntil > now)), ...M.leavers, refP, ...coaches].sort((a, b) => a.y - b.y);
    for (const p of ps) drawPlayer(p);
    if (R0.card && now < R0.cardUntil) { const cy = R0.y - 98 - Math.sin(Math.min(1, (R0.cardUntil - now) / 300) * 1.5) * 6; ctx.fillStyle = R0.card; ctx.save(); ctx.translate(R0.x + 14, cy); ctx.rotate(.12); rr(ctx, -13, -18, 26, 36, 4); ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore(); }
    if (M.board && now < M.board.until) drawBoard();
    for (const s of [0, 1]) { const c = M.coach[s]; if (c.bubble && now < c.bubble.until) { const tx2 = c.bubble.text; ctx.font = `800 17px ${F}`; const w = ctx.measureText(tx2).width + 22, bx = c.x + 30, by = c.y - 70; ctx.fillStyle = '#fff'; rr(ctx, bx, by, w, 30, 14); ctx.fill(); ctx.strokeStyle = TM[teamOf(s)].c1; ctx.lineWidth = 3; ctx.stroke(); ctx.beginPath(); ctx.moveTo(bx + 4, by + 22); ctx.lineTo(bx - 10, by + 34); ctx.lineTo(bx + 16, by + 28); ctx.fillStyle = '#fff'; ctx.fill(); ctx.fillStyle = '#16182a'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(tx2, bx + 11, by + 16); } }
    drawBall();
  }
  // projektör ışıkları
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const [x, y] of LIGHTS) { const gr = ctx.createRadialGradient(x, y, 4, x, y, 230); gr.addColorStop(0, 'rgba(255,250,220,.55)'); gr.addColorStop(.25, 'rgba(255,245,200,.15)'); gr.addColorStop(1, 'rgba(255,245,200,0)'); ctx.fillStyle = gr; ctx.fillRect(x - 230, y - 230, 460, 460); }
  ctx.restore();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of flyers) { if (f.t < 0) continue; const x = lerp(f.x0, f.x1, f.t), y = lerp(f.y0, f.y1, f.t) - Math.sin(f.t * Math.PI) * f.h; ctx.font = `${f.s}px ${F}`; ctx.globalAlpha = 1 - f.t * .3; ctx.fillText(f.e, x, y); ctx.globalAlpha = 1; }
  for (const q of particles) {
    const a = 1 - q.life / q.max; ctx.globalAlpha = a; ctx.fillStyle = q.c;
    if (q.rect) { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.fillRect(-q.s / 2, -q.s / 4, q.s, q.s / 2); ctx.restore(); }
    else if (q.glow) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ell(ctx, q.x, q.y, q.s, q.s); ctx.fill(); ctx.restore(); }
    else if (q.smoke) { ctx.globalAlpha = a * .5; ell(ctx, q.x, q.y, q.s * (1.6 - a * .6), q.s * (1.6 - a * .6)); ctx.fill(); }
    else { ell(ctx, q.x, q.y, q.s, q.s); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawScoreboard(); drawChatFeed(); drawSupport();
  if (phase === 'ht') drawHT();
  if (phase === 'pre') drawPre();
  if (phase === 'table') drawTable();
  if (phase === 'others') drawOthers();
  if (phase === 'champ') drawChamp();
  drawCallout(); drawToasts(); drawBig(); drawGoalFx();
}

/* ---------------- demo / test ---------------- */
const DEMO_NAMES = ['ayse_34', 'mehmetk', 'zeyno', 'emre.07', 'kral_ali', 'elifşen', 'burak61', 'deniz_', 'selin.k', 'mert', 'hatice55', 'oğuzhan', 'cansu', 'yusuf_06', 'ece', 'baran', 'nazlı', 'tuna', 'esra', 'kerem', 'sude', 'halil', 'derya', 'onur', 'merve', 'ahmet35', 'gamze', 'serkan', 'ipek', 'umut'];
for (let i = 1; i <= 50; i++) DEMO_NAMES.push(pick(['taraftar', 'tribun', 'futbolsever', 'kanka', 'maçkolik']) + '_' + i);
const DEMO_FAN = new Map();
function demoMsg(team) { return pick([`hadi ${team}`, `${team} ${team} ${team}`, 'gol lazım', 'hakem nereye bakıyor', 'bu pozisyon penaltı', 'çok iyi oynuyorlar', '⚽⚽', 'ofsayt mı o', 'kaleci harika', `en büyük ${team}`, 'son dakika golü gelir', 'tezahürat yapın']); }
let demoOn = CFG.demo, demoNext = { c: 0, g: 4000, l: 0 };
function demoTick() {
  if (!demoOn || !M) return;
  if (now > demoNext.c) {
    demoNext.c = now + rnd(300, 900); const u = pick(DEMO_NAMES);
    if (!DEMO_FAN.has(u)) DEMO_FAN.set(u, Math.random() < .7 ? pick([M.h, M.a]) : pick(TEAMS).id);
    const t = DEMO_FAN.get(u);
    handleEvent('chat', { uniqueId: u, nickname: u, comment: Math.random() < .5 ? demoMsg(t.toLocaleLowerCase('tr')) : demoMsg(t) });
  }
  if (now > demoNext.g && Q.get('nogift') !== '1') { demoNext.g = now + rnd(5000, 12000); const u = pick(DEMO_NAMES); handleEvent('gift', { uniqueId: u, nickname: u, diamondCount: pick([1, 1, 1, 5, 5, 10, 30]), repeatCount: 1, giftType: 2 }); }
  if (now > demoNext.l) { demoNext.l = now + rnd(600, 1500); const u = pick(DEMO_NAMES); handleEvent('like', { uniqueId: u, likeCount: Math.floor(rnd(5, 30)) }); }
}
let testSeq = 0;
function testAction(a) {
  if (a === 'chatH' || a === 'chatA') { if (!M) return; const t = a === 'chatH' ? M.h : M.a, u = 'test' + (++testSeq); handleEvent('chat', { uniqueId: u, nickname: 'İzleyici' + testSeq, comment: `hadi ${t}` }); }
  if (a === 'chatN') { const u = 'test' + (++testSeq); handleEvent('chat', { uniqueId: u, nickname: 'İzleyici' + testSeq, comment: 'selam herkese' }); }
  if (a[0] === 'g' && M) {
    const s = a[1] === 'H' ? 0 : 1, c = +a.slice(2), u = 'test' + (++testSeq);   // her basış yeni bir izleyici
    const key = { 1: 'tribun', 10: 'oyuncu', 20: 'penalti', 30: 'penalti' }[c], gn = a[1] === 'N' || !key ? 'Finger Heart' : CFG.giftMap[key + (s === 0 ? 'Ev' : 'Dep')][0];
    handleEvent('gift', { uniqueId: u, nickname: 'İzleyici' + testSeq, giftName: gn, diamondCount: c, repeatCount: 1, giftType: 2 });
  }
  if (a === 'like') { const fans = M ? fansOf(0) : []; handleEvent('like', { uniqueId: fans.length ? fans[0].uid : 'x', likeCount: 100 }); }
  if (a === 'next') phaseT0 = -1e12;
  if (a === 'skip') skipMatch();
  if (a === 'faul' && M && phase === 'play' && M.carrier && !M.windup) foul();
  if (a === 'kavga' && M && phase === 'play' && M.carrier && !M.windup) foul({ hard: true, fight: true, box: true });   // kavga sadece sert fauldan sonra
  if (a === 'hata' && M && phase === 'play') wrongCall(Math.random() < .5 ? 0 : 1, 'Faul değildi');
  if (a === 'arapas' && M && phase === 'play' && M.carrier && !M.ball.anim && !M.windup) throughBall();
  if (a === 'hakem') { const u = 'test' + (++testSeq); const v = viewer(u, 'Hakem' + testSeq); makeReferee(v); }
  if (a === 'reset') { newSeason(1); prepareMatch(); }
  if (a === 'demo') demoOn = !demoOn;
}
const tp = document.getElementById('tp'), tpBtn = document.getElementById('tpBtn');
tp.addEventListener('click', e => { const b = e.target.closest('button'); if (b) testAction(b.dataset.a); });
if (CFG.demo) tpBtn.hidden = false;
tpBtn.onclick = () => { tp.hidden = !tp.hidden; };
addEventListener('keydown', e => {
  if (e.key === 't' || e.key === 'T') tp.hidden = !tp.hidden;
  if (e.key === 'd' || e.key === 'D') { const d = document.getElementById('debug'); d.style.display = d.style.display === 'block' ? 'none' : 'block'; }
});
window.SIM = { handleEvent, testAction, state: () => ({ phase, round: S.round + 1, live: S.liveIdx, match: M ? `${M.h} ${M.score[0]}-${M.score[1]} ${M.a} ${Math.floor(M.min)}'` : null, fans: [M ? fansOf(0).length : 0, M ? fansOf(1).length : 0], now }), standings };

/* ---------------- başlat ---------------- */
paintStadium();
if (!load()) newSeason(1);
if (Q.get('reset') === '1') newSeason(1);
prepareMatch();
if (!CFG.demo) connect();
const dbg = document.getElementById('debug');
let lastTs = performance.now(), fps = 60, dbgT = 0;
function frame(ts) {
  let dt = Math.min(.05, (ts - lastTs) / 1000); lastTs = ts;
  fps = lerp(fps, 1 / Math.max(dt, 1e-3), .05);
  dt *= CFG.speed * (now < slowUntil ? .35 : 1); now += dt * 1000;   // golde ağır çekim
  demoTick(); updateFlow(dt); updateFx(dt); render();
  if ((dbgT += dt) > .5) { dbgT = 0; if (dbg.style.display === 'block') dbg.textContent = `${VERSION} | ws: ${CFG.demo ? 'demo' : wsState} | ${fps.toFixed(0)} fps | ${phase} | hafta ${S.round + 1}`; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
